<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>장보기 영수증 · 레시피 재료 스캐너</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper:#F5F1E6;
    --paper-dark:#EAE3D1;
    --ink:#20241C;
    --ink-soft:#54594B;
    --produce:#2F6D46;
    --produce-soft:#DCE9DE;
    --stamp:#B23A2E;
    --mustard:#C99A34;
    --line:#c9c0a6;
    --radius:2px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper-dark);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 16px 96px;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(32,36,28,0.06) 1px, transparent 0);
    background-size: 18px 18px;
  }

  .page{ width:100%; max-width:640px; }

  header{ text-align:center; margin-bottom:36px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.18em;
    font-size:11px;
    color:var(--produce);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(30px,6vw,42px);
    margin:0 0 8px;
    line-height:1.1;
  }
  .sub{ color:var(--ink-soft); font-size:14.5px; max-width:440px; margin:0 auto; }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 1px 0 rgba(32,36,28,.04);
  }
  .card h2{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 14px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .num{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  input[type=url]{
    width:100%;
    padding:12px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  input[type=url]:focus{ border-color:var(--produce); }
  input[type=url]::placeholder{ color:#a8a091; }

  .drop{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    position:relative;
  }
  .drop:hover, .drop.drag{ border-color:var(--produce); background:var(--produce-soft); }
  .drop input{ display:none; }
  .drop-label{ font-size:13.5px; color:var(--ink-soft); }
  .drop-label b{ color:var(--ink); }

  .preview{
    margin-top:14px;
    display:none;
    align-items:center;
    gap:12px;
    background:#fff;
    border:1px solid var(--line);
    padding:8px;
    border-radius:var(--radius);
  }
  .preview.show{ display:flex; }
  .preview img{ width:56px; height:56px; object-fit:cover; border-radius:2px; }
  .preview .name{ font-size:12.5px; font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .preview button{
    background:none; border:none; color:var(--stamp); cursor:pointer; font-size:12px;
    font-family:'IBM Plex Mono', monospace;
  }

  .go{
    width:100%;
    padding:15px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .go:hover:not(:disabled){ background:#000; }
  .go:active:not(:disabled){ transform:scale(.995); }
  .go:disabled{ opacity:.5; cursor:not-allowed; }

  .status{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0 0;
    min-height:16px;
  }
  .status.error{ color:var(--stamp); }

  /* Receipt result */
  .receipt-wrap{ display:none; margin-top:28px; }
  .receipt-wrap.show{ display:block; animation:rise .35s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  .receipt{
    background:#fff;
    border:1px solid var(--line);
    position:relative;
    padding:28px 24px 20px;
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute; left:0; right:0; height:8px;
    background-image: radial-gradient(circle at 6px 4px, var(--paper-dark) 4px, transparent 4.2px);
    background-size:12px 8px;
    background-repeat:repeat-x;
  }
  .receipt::before{ top:-1px; }
  .receipt::after{ bottom:-1px; transform:rotate(180deg); }

  .receipt-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    text-align:center;
    margin:4px 0 2px;
  }
  .receipt-meta{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    margin-bottom:18px;
  }
  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:16px 0;
  }
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    color:var(--ink-soft);
  }
  ul.ing{ list-style:none; margin:0; padding:0; }
  ul.ing li{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    padding:6px 0;
    border-bottom:1px dotted var(--line);
  }
  ul.ing li:last-child{ border-bottom:none; }
  ul.ing .amt{ color:var(--ink-soft); flex-shrink:0; }

  .owned .mark{ color:var(--produce); margin-right:8px; }
  .missing .mark{ color:var(--stamp); margin-right:8px; }

  .stamp-row{
    position:relative;
  }
  .stamp{
    position:absolute;
    right:0; top:-6px;
    transform:rotate(-8deg);
    border:2px solid var(--stamp);
    color:var(--stamp);
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:11px;
    padding:3px 8px;
    border-radius:4px;
    letter-spacing:.05em;
    opacity:.9;
  }

  .total{
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid var(--ink);
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
  }

  footer{
    text-align:center;
    margin-top:28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:#9b9382;
  }

  @media (max-width:480px){
    .card{ padding:16px; }
    .receipt{ padding:22px 16px 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">AI 재료 스캐너</div>
    <h1>장보기 영수증</h1>
    <p class="sub">레시피 영상 링크와 냉장고 사진을 넣으면, 이미 있는 재료와 사야 할 재료를 영수증처럼 정리해드려요.</p>
  </header>

  <div class="card">
    <h2><span class="num">1</span> 레시피 유튜브 URL</h2>
    <input type="url" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." />
  </div>

  <div class="card">
    <h2><span class="num">2</span> 보유 재료 사진</h2>
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" />
      <div class="drop-label"><b>클릭</b>하거나 이미지를 끌어다 놓으세요<br/>냉장고 · 팬트리 · 장바구니 사진 모두 좋아요</div>
    </label>
    <div class="preview" id="preview">
      <img id="previewImg" />
      <div class="name" id="previewName"></div>
      <button id="previewRemove" type="button">삭제</button>
    </div>
  </div>

  <button class="go" id="goBtn">영수증 뽑기</button>
  <p class="status" id="statusMsg"></p>

  <div class="receipt-wrap" id="receiptWrap">
    <div class="receipt" id="receipt"></div>
  </div>

  <footer>Gemini로 분석됨 · 결과는 참고용이며 실제 재료 상태와 다를 수 있어요</footer>
</div>

<script>
  const ytUrlInput = document.getElementById('ytUrl');
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const previewName = document.getElementById('previewName');
  const previewRemove = document.getElementById('previewRemove');
  const goBtn = document.getElementById('goBtn');
  const statusMsg = document.getElementById('statusMsg');
  const receiptWrap = document.getElementById('receiptWrap');
  const receiptEl = document.getElementById('receipt');

  let imageFile = null;
  let imageBase64 = null;

  function setImage(file){
    if(!file || !file.type.startsWith('image/')) return;
    imageFile = file;
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // data:<mime>;base64,<data>
      imageBase64 = result.split(',')[1];
      previewImg.src = result;
      previewName.textContent = file.name;
      preview.classList.add('show');
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener('change', e => setImage(e.target.files[0]));

  ['dragover','dragenter'].forEach(evt =>
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag'); })
  );
  ['dragleave','drop'].forEach(evt =>
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag'); })
  );
  dropZone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if(file) setImage(file);
  });

  previewRemove.addEventListener('click', (e) => {
    e.preventDefault();
    imageFile = null; imageBase64 = null;
    fileInput.value = '';
    preview.classList.remove('show');
  });

  function isValidYoutubeUrl(url){
    return /^https?:\/\/(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)/.test(url.trim());
  }

  function setStatus(text, isError=false){
    statusMsg.textContent = text;
    statusMsg.classList.toggle('error', isError);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderReceipt(data){
    const required = Array.isArray(data.requiredIngredients) ? data.requiredIngredients : [];
    const owned = Array.isArray(data.ownedIngredients) ? data.ownedIngredients : [];
    const missing = Array.isArray(data.missingIngredients) ? data.missingIngredients : [];

    const ownedHtml = owned.length
      ? owned.map(name => `<li><span><span class="mark">✓</span>${escapeHtml(name)}</span></li>`).join('')
      : `<li style="border:none;color:var(--ink-soft)">보유 재료가 확인되지 않았어요</li>`;

    const missingHtml = missing.length
      ? missing.map(item => `<li><span><span class="mark">＋</span>${escapeHtml(item.name)}</span><span class="amt">${escapeHtml(item.amount || '')}</span></li>`).join('')
      : `<li style="border:none;color:var(--ink-soft)">추가로 살 재료가 없어요, 바로 요리 시작!</li>`;

    receiptEl.innerHTML = `
      <div class="receipt-title">${escapeHtml(data.recipeTitle || '레시피')}</div>
      <div class="receipt-meta">TOTAL ${required.length}개 재료 · 보유 ${owned.length} · 구매 필요 ${missing.length}</div>
      <hr class="divider" />
      <div class="section-label"><span>보유 재료</span><span>OWNED</span></div>
      <ul class="ing owned">${ownedHtml}</ul>
      <hr class="divider" />
      <div class="section-label stamp-row"><span>구매 필요</span><span>TO BUY</span>${missing.length ? '<span class="stamp">구매 필요</span>' : ''}</div>
      <ul class="ing missing">${missingHtml}</ul>
      <div class="total"><span>장보기 목록</span><span>${missing.length}개 항목</span></div>
    `;
    receiptWrap.classList.add('show');
  }

  async function handleGenerate(){
    const youtubeUrl = ytUrlInput.value.trim();

    if(!isValidYoutubeUrl(youtubeUrl)){
      setStatus('올바른 유튜브 URL을 입력해주세요.', true);
      return;
    }
    if(!imageBase64){
      setStatus('보유 재료 사진을 업로드해주세요.', true);
      return;
    }

    goBtn.disabled = true;
    receiptWrap.classList.remove('show');
    setStatus('영상과 사진을 분석하는 중이에요... (최대 1분 정도 걸릴 수 있어요)');

    try{
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          youtubeUrl,
          imageBase64,
          mimeType: imageFile ? imageFile.type : 'image/jpeg'
        })
      });

      const data = await res.json();

      if(!res.ok){
        throw new Error(data.error || '분석 중 오류가 발생했어요.');
      }

      renderReceipt(data);
      setStatus('분석 완료!');
    }catch(err){
      console.error(err);
      setStatus(err.message || '분석 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.', true);
    }finally{
      goBtn.disabled = false;
    }
  }

  goBtn.addEventListener('click', handleGenerate);
</script>
</body>
</html>
